aid: homage
name: Homage
description: >-
  Homage is a Singapore-headquartered holistic health and caregiving platform that
  connects families with screened, professional caregivers, nurses, and therapists
  to deliver personal care, home nursing procedures, rehabilitation, and health
  services where people live. Founded in 2016, Homage operates across Singapore,
  Malaysia, and Australia through consumer mobile apps and a care-management
  operations platform, offering flexible on-demand and recurring visits, care
  assessments, custom care plans, and teleconsultations for conditions such as
  dementia, stroke recovery, and post-surgical care. Homage does not currently
  publish a public developer API, developer portal, SDKs, or OpenAPI definition;
  this profile captures its public web properties and probed domain security.
